name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack dry run
        run: npm pack --dry-run

  node18-runtime:
    name: Node.js 18 runtime smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Check Node.js 18 runtime behavior
        run: |
          node --experimental-global-webcrypto --input-type=module <<'NODE'
          const root = await import("./dist/index.js");
          const cloudflare = await import("./dist/cloudflare.js");
          const testing = await import("./dist/testing.js");
          const cookieSession = await import("./dist/cookie-session.js");

          if (typeof root.createSealer !== "function") {
            throw new Error("Missing root createSealer export.");
          }

          if (typeof root.generateSealKey !== "function") {
            throw new Error("Missing root generateSealKey export.");
          }

          if (typeof cloudflare.cloudflareKVReplayStore !== "function") {
            throw new Error("Missing cloudflareKVReplayStore export.");
          }

          if (typeof testing.createTestSealer !== "function") {
            throw new Error("Missing createTestSealer export.");
          }

          if (typeof cookieSession.createCookieSession !== "function") {
            throw new Error("Missing createCookieSession export.");
          }

          const sealer = root.createSealer({
            issuer: "ci-node18",
            keys: {
              "2026-06": root.generateSealKey()
            },
            currentKeyId: "2026-06",
            clock: () => 1779340000000
          });

          const SessionToken = sealer.defineToken({
            purpose: "ci.session",
            ttl: "1m",
            audience: "ci"
          });

          const token = await SessionToken.seal({ userId: "user_123" });
          const result = await SessionToken.unseal(token);

          if (!result.ok || result.payload.userId !== "user_123") {
            throw new Error("Node.js 18 seal/unseal smoke failed.");
          }
          NODE

          node --experimental-global-webcrypto bin/stateless-seal.mjs keygen > /dev/null
          node --experimental-global-webcrypto bin/stateless-seal.mjs --help > /dev/null

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    needs:
      - node
      - node18-runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Check dist exports and CLI
        run: |
          node --input-type=module <<'NODE'
          const root = await import("./dist/index.js");
          const cloudflare = await import("./dist/cloudflare.js");
          const testing = await import("./dist/testing.js");
          const cookieSession = await import("./dist/cookie-session.js");

          if (typeof root.createSealer !== "function") {
            throw new Error("Missing root createSealer export.");
          }

          if (typeof cloudflare.cloudflareKVReplayStore !== "function") {
            throw new Error("Missing cloudflareKVReplayStore export.");
          }

          if (typeof testing.createTestSealer !== "function") {
            throw new Error("Missing createTestSealer export.");
          }

          if (typeof cookieSession.createCookieSession !== "function") {
            throw new Error("Missing createCookieSession export.");
          }
          NODE

          node bin/stateless-seal.mjs keygen
          node bin/stateless-seal.mjs --help
